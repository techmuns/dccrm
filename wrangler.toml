# Cloudflare Pages + Functions config for the Dhamma Capital CRM.
#
# Functions in /functions are auto-detected by Pages — no config needed for them.
# The API needs a D1 database bound as "DB" (env.DB). It is bound below. For a Pages
# project a top-level [[d1_databases]] block applies to BOTH the production and
# preview environments, so this single block is all that's needed (only split into
# [[env.production.d1_databases]] / [[env.preview.d1_databases]] to point each
# environment at a different database).

name = "dccrm"
pages_build_output_dir = "."
compatibility_date = "2024-09-01"

# D1 binding — applies to both production and preview (top-level Pages config).
[[d1_databases]]
binding = "DB"                 # do not rename — the API reads env.DB
database_name = "dccrm"
database_id = "01e845b3-8664-40d5-b218-3ee77df831ba"
