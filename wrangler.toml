# Cloudflare Pages + Functions config for the Dhamma Capital CRM.
#
# Functions in /functions are auto-detected by Pages — no config needed for them.
# The API needs a D1 database bound as "DB" (env.DB). You can bind it EITHER in the
# Cloudflare dashboard (Pages → your project → Settings → Functions → D1 bindings —
# the simplest path, recommended) OR here by uncommenting the block below and
# pasting your database id. See the PR description for the full one-time setup.

name = "dccrm"
pages_build_output_dir = "."
compatibility_date = "2024-09-01"

# [[d1_databases]]
# binding = "DB"                 # do not rename — the API reads env.DB
# database_name = "dccrm"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # from: wrangler d1 create dccrm
