name: Enrich contacts (AI)

# Bulk relationship scoring on Amazon Bedrock (patient retries — no Worker timeout).
# Fired three ways:
#   • by the app  — POST /api/ai/refresh-all sends a repository_dispatch (enrich-contacts)
#   • nightly     — 02:00 UTC, only contacts changed since they were last scored
#   • manually    — the "Run workflow" button (choose all / changed)
# The runner reads the contacts from the Worker and posts scores back; both calls are
# authenticated with GHA_SECRET. Nothing sensitive travels in the dispatch payload.

on:
  repository_dispatch:
    types: [enrich-contacts]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which contacts to score: all or changed'
        default: 'all'

concurrency:
  group: ai-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Score contacts (patient Bedrock retries)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          GHA_SECRET: ${{ secrets.GHA_SECRET }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ vars.BEDROCK_MODEL_IDS }}
          # schedule → changed; dispatch/manual → the requested scope (default all)
          SCOPE: ${{ github.event_name == 'schedule' && 'changed' || github.event.client_payload.scope || github.event.inputs.scope || 'all' }}
        run: node scripts/ai-enrich.mjs
