name: Ingest email replies

# Reads UNSEEN messages from the dedicated IMAP catcher inbox (or the sample file in TEST
# mode until IMAP is connected) and POSTs each raw email to the Worker
# (/api/replies/ingest, authenticated with INGEST_SECRET). The Worker does the AI
# classification and all CRM updates; a message is marked Seen only on a successful POST.
# Runs every 5 minutes, or on demand.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: email-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Only the IMAP path needs these; installed here (the app itself has no build step
      # and no npm dependencies, so there is no package.json at the repo root).
      - name: Install IMAP client + email parser
        run: npm install --no-fund --no-audit imapflow mailparser
      # AI classification now runs server-side in the ingest endpoint, so this reader needs
      # only the inbox + the Worker handshake — no Bedrock secrets travel through the runner.
      - name: Read inbox and ingest
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          IMAP_MAILBOX: ${{ vars.IMAP_MAILBOX }}
        run: node scripts/email-ingest.mjs
